name: mardan-amr
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.10
  - pip
  
  # Core scientific computing
  - numpy>=1.23.0
  - pandas>=1.5.0
  - scipy>=1.9.0
  
  # Visualization
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  
  # Jupyter
  - jupyter
  - jupyterlab
  - notebook
  
  # R and R packages
  - r-base>=4.2.0
  - r-ggplot2
  - r-viridis
  - r-dplyr
  - r-tidyr
  - r-scales
  
  # Additional tools
  - openpyxl  # For Excel file handling
  - xlrd      # For reading Excel files
  
  # Python packages via pip
  - pip:
    - networkx>=2.8
    - scikit-learn>=1.1.0
